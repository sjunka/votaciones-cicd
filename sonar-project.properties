sonar.projectKey=sjunka_votaciones-cicd
sonar.organization=sjunka
sonar.sources=api/app,web/src
sonar.tests=api/tests
sonar.exclusions=web/src/**/*.test.*,sustentacion/**,docs/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.coverage.exclusions=**/tests/**,web/src/main.jsx,web/src/App.jsx,web/src/pages/**,web/src/components/**,**/*.test.*
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# CloudFront sin access logs (S6258): exigiría un bucket S3 con ACL; los logs de la app ya van a CloudWatch
sonar.issue.ignore.multicriteria=cflogs
sonar.issue.ignore.multicriteria.cflogs.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.cflogs.resourceKey=infra/main.tf
