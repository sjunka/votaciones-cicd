        var t = null;
        try {
          t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('tema');
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

      })();
